<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Achievements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #0a0418;
      --bg-2: #1a0a3a;
      --purple: #a855f7;
      --purple-soft: #7c3aed;
      --text: #ffffff;
      --muted: #c9b8ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 0%, var(--bg-2) 0%, var(--bg-1) 70%);
      overflow: hidden;
    }

    /* ===== PAGE LAYOUT: 1 screen lang, walang scroll ===== */
    .page {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 2vh 3vw 2vh;
      gap: 1.6vh;
    }

    /* ===== TITLE ===== */
    .title h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6rem, 3.4vw, 2.8rem);
      font-weight: 700;
    }
    .title h1 span { color: var(--purple); }
    .title p { color: var(--muted); font-size: .95rem; margin-top: .3vh; }

    /* ===== TIMELINE (mga logo) ===== */
    .timeline {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      flex: 0 0 auto;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 12%; right: 12%;
      top: calc(clamp(46px, 8vh, 80px) / 2);
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--purple), transparent);
    }
    .school { text-align: center; position: relative; }
    .school .logo {
      width: clamp(46px, 8vh, 80px);
      height: clamp(46px, 8vh, 80px);
      border-radius: 50%;
      border: 3px solid var(--purple);
      background: #fff;
      object-fit: contain;
      box-shadow: 0 0 22px rgba(168, 85, 247, .65);
    }
    .school h3 { font-size: clamp(.75rem, 1.2vw, 1rem); font-weight: 600; margin-top: .8vh; }
    .school .level { color: var(--purple); font-size: .7rem; font-weight: 600; letter-spacing: .12em; }
    .school .years { color: var(--muted); font-size: .8rem; }

    /* ===== HEADING NG PICTURES ===== */
    .pics-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.1rem, 1.8vw, 1.5rem);
      font-weight: 500;
    }
    .pics-title span { color: var(--purple); }

    /* ===== GRID NG 4 CARDS: kinukuha ang natitirang taas ===== */
    .pics-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.4vw;
    }

    /* ===== CARD: frame sa taas, text sa baba ===== */
    .card {
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 1vh;
      padding: 1vh 1vw;
      border: 1px solid rgba(168, 85, 247, .45);
      border-radius: 18px;
      background: rgba(124, 58, 237, .08);
    }

    /* FRAME: sakop ang natitirang taas ng card */
    .frame {
      flex: 1;
      min-height: 0;
      border: 2px dashed var(--purple-soft);
      border-radius: 12px;
      background: #0d0620;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* PICTURE: kita ang buo, hanggang paa, walang putol */
    .frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* TEXT: laging nasa ilalim ng frame */
    .card .caption {
      flex: 0 0 auto;
      text-align: center;
      font-size: clamp(.8rem, 1.1vw, 1rem);
      font-weight: 500;
    }

    /* ===== MAS MALIIT NA SCREEN: 1 page pa rin, walang scroll ===== */
    @media (max-width: 900px) {
      .pics-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 1.2vh 3vw; }
      .school h3 { font-size: .6rem; }
      .school .level, .school .years { font-size: .58rem; }
      .timeline::before { display: none; }
    }
    @media (max-height: 600px) {
      .title p { display: none; }
      .school .years { display: none; }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="title">
      <h1>My <span>Achievements</span></h1>
      <p>My journey from elementary to college</p>
    </header>

    <section class="timeline" id="timeline"></section>

    <h2 class="pics-title">&#127942; Achievement <span>Pictures</span></h2>

    <section class="pics-grid" id="pics"></section>

  </main>

  <script>
    // ====== EDIT DITO: mga school logos ======
    const schools = [
      { name: "Uyong Elementary School",                 level: "ELEMENTARY",  years: "2014 – 2020",    logo: "images/uyong-logo.png" },
      { name: "Labrador National High School",           level: "JUNIOR HIGH", years: "2020 – 2024",    logo: "images/lnhs-logo.png" },
      { name: "Escuela de Nuestra Señora de La Salette", level: "SENIOR HIGH", years: "2024 – 2026",    logo: "images/salette-logo.png" },
      { name: "University of the Cordilleras",           level: "COLLEGE",     years: "2026 – Present", logo: "images/uc-logo.png" }
    ];

    // ====== EDIT DITO: mga achievement pictures at text sa baba ======
    const pictures = [
      { src: "images/with-honors.jpg",   caption: "With honors" },
      { src: "images/diploma-2.jpg",     caption: "Completed Diploma 2" },
      { src: "images/best-research.jpg", caption: "Best in Research" },
      { src: "images/diploma-humms.jpg", caption: "Completed Diploma (HUMMS)" }
    ];

    // ====== Hindi na kailangang galawin ang nasa ibaba ======
    document.getElementById("timeline").innerHTML = schools.map(s => `
      <div class="school">
        <img class="logo" src="${s.logo}" alt="${s.name} logo">
        <h3>${s.name}</h3>
        <div class="level">${s.level}</div>
        <div class="years">${s.years}</div>
      </div>
    `).join("");

    document.getElementById("pics").innerHTML = pictures.map(p => `
      <article class="card">
        <div class="frame"><img src="${p.src}" alt="${p.caption}"></div>
        <p class="caption">${p.caption}</p>
      </article>
    `).join("");
  </script>
</body>
</html>
